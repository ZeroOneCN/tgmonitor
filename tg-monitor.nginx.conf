# Nginx 反向代理配置示例
# 将以下内容保存到 /etc/nginx/sites-available/tg-monitor 或 /etc/nginx/conf.d/tg-monitor.conf
# 然后执行: sudo ln -s /etc/nginx/sites-available/tg-monitor /etc/nginx/sites-enabled/
# 或直接在 conf.d 目录下: sudo systemctl reload nginx

server {
    listen 80;
    server_name your-domain.com;  # 改为你的域名或服务器IP

    # 自动跳转 HTTPS（如果配置了 SSL 证书）
    # return 301 https://$host$request_uri;
    # }

# server {
#     listen 443 ssl http2;
#     server_name your-domain.com;

#     ssl_certificate /etc/nginx/ssl/fullchain.pem;
#     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_ciphers HIGH:!aNULL:!MD5;

    # 静态文件缓存
    location /static/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # WebSocket 代理（实时日志）
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # 主应用代理
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
        proxy_send_timeout 120;
    }
}